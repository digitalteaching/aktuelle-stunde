<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aktuelle Stunde Stromsteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ============ Farben und Schriften ============ */
:root{
  color-scheme: light;
  --paper:#F4F5F1; --panel:#FFFFFF; --panel-2:#E7EAE4;
  --ink:#171C28; --ink-2:#465068; --ink-3:#6B748A;
  --rule:#D0D5DB; --rule-2:#E2E5E1;
  --acc:#2F45B5; --acc-ink:#22338C; --acc-soft:#E3E7FA;
  --ok:#127A47; --ok-soft:#DDF2E5;
  --no:#BF2F49; --no-soft:#FAE3E8;
  --open:#9A5A00; --open-soft:#FFF0D6;
  --seg1:#CFD4DF; --seg2:#B4BCCD; --seg3:#98A2B8;
  --sheet-shadow:0 1px 1px rgba(23,28,40,.06), 0 14px 34px -14px rgba(23,28,40,.28);
  --sans:"Source Sans 3","Source Sans Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro",Charter,"Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#11151D; --panel:#1A202B; --panel-2:#252D3A;
  --ink:#EEF1F6; --ink-2:#BAC3D3; --ink-3:#8993A8;
  --rule:#374152; --rule-2:#2A3240;
  --acc:#8C9CF5; --acc-ink:#B6C0FB; --acc-soft:#232C55;
  --ok:#3CC47C; --ok-soft:#16321F;
  --no:#F0778C; --no-soft:#3A1F26;
  --open:#F2A93B; --open-soft:#33280F;
  --seg1:#3A4456; --seg2:#4A566C; --seg3:#5C6A84;
  --sheet-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#11151D; --panel:#1A202B; --panel-2:#252D3A;
  --ink:#EEF1F6; --ink-2:#BAC3D3; --ink-3:#8993A8;
  --rule:#374152; --rule-2:#2A3240;
  --acc:#8C9CF5; --acc-ink:#B6C0FB; --acc-soft:#232C55;
  --ok:#3CC47C; --ok-soft:#16321F;
  --no:#F0778C; --no-soft:#3A1F26;
  --open:#F2A93B; --open-soft:#33280F;
  --seg1:#3A4456; --seg2:#4A566C; --seg3:#5C6A84;
  --sheet-shadow:0 14px 34px -14px rgba(0,0,0,.7);
}

/* ============ Bühne ============ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;background:var(--paper);color:var(--ink);
  font-size:26px;line-height:1.4;transform-origin:center center;overflow:hidden;flex:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}

/* ============ Zeitleiste oben ============ */
#rail{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:26px;padding:0 40px;border-bottom:1px solid var(--rule)}
.brand{flex:none;line-height:1.15}
.brand b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:15px;color:var(--ink-3)}
#track{flex:1;display:flex;position:relative;height:48px;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--panel)}
#track button{flex:var(--m) 1 84px;min-width:0;border:0;border-right:1px solid var(--rule);background:transparent;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 12px;position:relative;z-index:1;
  line-height:1.15;color:var(--ink-3);text-align:left}
#track button:last-of-type{border-right:0}
#track button b{font-size:16px;font-weight:600;white-space:nowrap}
#track button span{font-size:13px;white-space:nowrap}
#track button.past{color:var(--ink-2)}
#track button.cur{color:var(--acc-ink);background:var(--acc-soft)}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--panel-2);z-index:0;transition:width 1s linear}
#marker{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);left:0;z-index:2;transition:left 1s linear;display:none}
#track.running #marker{display:block}
#clock{flex:none;border:1px solid var(--rule);background:var(--panel);border-radius:10px;height:48px;padding:0 14px;
  font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;cursor:pointer;min-width:150px;text-align:center}
#clock small{font-size:14px;font-weight:400;color:var(--ink-3);margin-left:6px}
#clock.over{color:var(--no);border-color:var(--no)}

/* ============ Leiste unten ============ */
#bar{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;font-size:16px;color:var(--ink-3);border-top:1px solid var(--rule-2)}
#where{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav{display:flex;gap:6px;align-items:center;flex:none}
.nav button{background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink-3);font-size:16px}
.nav button:hover{border-color:var(--rule);color:var(--ink)}
.nav .arrow{font-size:20px;line-height:1;padding:4px 12px}
#counter{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:64px;text-align:center}
#stepdots{display:flex;gap:5px;margin-right:10px}
#stepdots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
#stepdots i.on{background:var(--acc)}
#minitimer{font-variant-numeric:tabular-nums;color:var(--acc-ink);font-weight:600;margin-right:8px;display:none}
#minitimer.show{display:inline}

/* ============ Folien ============ */
#deck{position:absolute;left:0;right:0;top:76px;bottom:48px}
.slide{position:absolute;inset:0;padding:28px 56px 20px;display:none}
.slide.active{display:block;animation:slidein .28s ease both}
@keyframes slidein{from{opacity:0}to{opacity:1}}
.slide [data-step]{transition:opacity .35s ease, visibility 0s linear .35s}
.slide [data-step]:not(.vis){opacity:0;visibility:hidden}
.slide [data-step].vis{opacity:1;visibility:visible;transition:opacity .35s ease, visibility 0s}

h1{font-size:44px;line-height:1.12;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
h3{font-size:22px;line-height:1.25;margin:0 0 8px;font-weight:600}
p{margin:0 0 12px}
.sub{font-size:24px;color:var(--ink-2);margin:0 0 18px;max-width:46em}
.small{font-size:19px;line-height:1.4}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.btn{font-size:18px;font-weight:600;padding:8px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--panel);cursor:pointer;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn.on,.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.on,:root[data-theme="dark"] .btn.primary{color:#11151D}
.ask{font-size:28px;line-height:1.35;font-weight:500}
.ask::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-right:12px;vertical-align:middle;position:relative;top:-2px}
.tip{background:var(--acc-soft);border-left:5px solid var(--acc);border-radius:0 12px 12px 0;padding:12px 20px;font-size:22px;line-height:1.4}
.tip .lbl{display:block;font-size:16px;font-weight:700;color:var(--acc-ink);margin-bottom:2px}
.num{font:inherit;width:70px;height:40px;border:1.5px solid var(--rule);border-radius:8px;background:var(--panel);text-align:center;
  font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{border-color:var(--acc);outline:none}

/* ---- Start ---- */
.t-wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:64px;height:100%;align-items:center}
.t-date{font-size:22px;color:var(--ink-3);margin:0 0 16px}
.t-thema{font-family:var(--serif);font-size:78px;line-height:1.02;font-weight:600;letter-spacing:-.02em;margin:0 0 26px}
.t-frage{font-size:30px;line-height:1.3;color:var(--ink-2);max-width:21em;margin:0}
.t-side{border-left:1px solid var(--rule);padding-left:44px}
.t-side > p{font-size:22px;color:var(--ink-2);margin:0 0 26px}
.rules{display:flex;flex-direction:column;gap:20px}
.rules div b{display:block;font-size:28px;line-height:1.2;font-weight:600}
.rules div span{font-size:21px;color:var(--ink-2)}

/* ---- Rückblick ---- */
.rueck{max-width:1200px}
.rueck ul{margin:12px 0 0;padding-left:1.1em;font-size:26px}
.rueck li{margin-bottom:10px}

/* ---- Aufhänger ---- */
.hook{display:grid;grid-template-columns:1fr 560px;gap:60px;height:100%;align-items:center}
.hook h1{font-family:var(--serif);font-size:64px;line-height:1.06;font-weight:600;letter-spacing:-.015em;margin:0 0 22px}
.hook .sub{font-size:26px;margin-bottom:34px}
.sheet{background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--sheet-shadow);padding:34px 38px 26px;
  transform:rotate(-1.2deg);font-family:var(--serif)}
.sheet .sh-head{font-family:var(--sans);font-size:17px;color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:18px}
.sheet .sh-head b{display:block;font-size:24px;color:var(--ink);font-weight:600}
.sheet ol{margin:0;padding:0;list-style:none;counter-reset:p}
.sheet li{counter-increment:p;display:grid;grid-template-columns:44px 1fr;margin-bottom:20px}
.sheet li::before{content:counter(p) ".";font-size:34px;font-weight:600;line-height:1.1}
.sheet li b{display:block;font-size:30px;line-height:1.15;font-weight:600;margin-bottom:4px}
.sheet li span{display:block;font-size:22px;line-height:1.35;color:var(--ink-2)}
.sheet .sh-foot{font-family:var(--sans);font-size:15px;color:var(--ink-3);margin:6px 0 0}

/* ---- Vorwissens-Check ---- */
.ck-head{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.klasse{flex:none;display:flex;align-items:center;gap:10px;font-size:18px;color:var(--ink-2);padding-top:8px}
.sts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.st{display:grid;grid-template-columns:52px 1fr auto;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 20px 12px 14px}
.st-l{font-size:28px;font-weight:700;color:var(--acc-ink);text-align:center}
.st-t{font-family:var(--serif);font-size:27px;line-height:1.28;margin:0}
.st-v{display:flex;gap:18px;align-items:center;font-size:18px;color:var(--ink-2);white-space:nowrap}
.st-v label{display:flex;align-items:center;gap:8px}
.st-u b{display:inline-block;min-width:34px;text-align:center;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- Sachanalyse: die vier festen Fragen ---- */
.qnav{display:flex;gap:8px;list-style:none;margin:0 0 14px;padding:0;counter-reset:q;font-size:17px;color:var(--ink-3)}
.qnav li{counter-increment:q;padding:3px 12px 3px 8px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
.qnav li::before{content:counter(q);display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--panel-2);
  color:var(--ink-2);font-weight:700;font-size:14px;text-align:center;margin-right:8px}
.qnav li.done{color:var(--ink-2)}
.qnav li.cur{color:var(--acc-ink);border-color:var(--acc);background:var(--acc-soft);font-weight:600}
.qnav li.cur::before{background:var(--acc);color:#fff}

.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:14px}
.lane{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px 22px 8px}
.lane h3{font-size:24px;color:var(--acc-ink);margin-bottom:12px}
.who{margin-bottom:14px}
.who b{display:block;font-size:24px;line-height:1.2}
.who span{display:block;font-size:19px;line-height:1.35;color:var(--ink-2)}
.slide .tip.below{margin-top:16px}

.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:12px}
.pos{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px 20px 14px;display:flex;flex-direction:column;min-height:262px}
.pos header{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:start;margin-bottom:10px}
.pos header b{font-size:23px;line-height:1.2}
.pos header span{grid-column:1;font-size:17px;color:var(--ink-3)}
.pos .tag{grid-column:2;grid-row:1 / span 2;font-style:normal;font-size:16px;font-weight:600;border:1.5px solid var(--ink-3);color:var(--ink-2);border-radius:999px;padding:2px 12px;white-space:nowrap}
.pos blockquote{margin:0 0 10px;font-family:var(--serif);font-size:24px;line-height:1.3}
.pos blockquote.para{font-family:var(--sans);font-size:22px}
.pos blockquote.para::before{content:"sinngemäß";display:block;font-size:14px;font-weight:600;color:var(--ink-3)}
.pos .will{margin:auto 0 0;font-size:18px;line-height:1.35;color:var(--ink-2);border-top:1px solid var(--rule-2);padding-top:8px}

.tl{display:grid;gap:14px;margin-top:10px;position:relative}
.tl.six{grid-template-columns:repeat(6,1fr)}
.tl.four{grid-template-columns:repeat(4,1fr)}
.ev{position:relative;padding-top:22px}
.ev::before{content:"";position:absolute;left:0;right:-14px;top:6px;height:3px;background:var(--rule)}
.ev:last-child::before{right:0}
.ev::after{content:"";position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:var(--acc)}
.ev time{display:block;font-size:17px;font-weight:600;color:var(--acc-ink)}
.ev b{display:block;font-size:22px;line-height:1.2;margin:2px 0 4px}
.ev span{display:block;font-size:18px;line-height:1.35;color:var(--ink-2)}
.ev.fut::before{background:repeating-linear-gradient(90deg,var(--ink-3) 0 8px,transparent 8px 14px)}
.ev.fut::after{background:var(--paper);border:3px solid var(--ink-3)}
.ev.fut time{color:var(--ink-2)}
.tl-h{font-size:20px;font-weight:600;color:var(--ink-2);margin:20px 0 0}

.spiel{display:grid;gap:36px;margin-top:14px;align-items:start}
.spiel > div{display:flex;flex-direction:column;gap:18px;min-width:0}
.blk h3{margin-bottom:10px}
.blk .src{font-size:15px;color:var(--ink-3);margin:8px 0 0}
.blk.txt p{font-size:23px;line-height:1.4;margin:0}
.stp-bar{display:flex;height:108px;border-radius:8px;overflow:hidden}
.stp-seg{flex:none;width:var(--w);display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden;
  border-right:2px solid var(--paper);line-height:1.15;transition:width .9s ease, background-color .4s}
.stp-seg b{font-size:24px;font-variant-numeric:tabular-nums}
.stp-seg span{font-size:16px}
.stp-seg:nth-child(1){background:var(--seg1)} .stp-seg:nth-child(2){background:var(--seg2)} .stp-seg:nth-child(3){background:var(--seg3)}
.stp-seg.fokus{background:var(--seg3);padding:0;border-right:0}
.stp.fok .stp-seg.fokus{background:var(--acc)}
.stp.neu .stp-seg.fokus{width:var(--wneu)}
.stp-ghost{flex:1;border:2px dashed var(--acc);border-left:0;border-radius:0 8px 8px 0;opacity:0;transition:opacity .4s .6s}
.stp.neu .stp-ghost{opacity:1}
.stp-calls{display:flex;flex-direction:column;align-items:flex-end;margin-top:8px;min-height:74px}
.stp-call{font-size:21px;font-weight:600;color:var(--acc-ink);margin:0;text-align:right}
.stp-call.first::before{content:"";display:inline-block;border:8px solid transparent;border-bottom-color:var(--acc);border-top:0;margin-right:8px;vertical-align:2px}
.rech{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:20px 24px}
.rech .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rech input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0 2px}
.rech .kwh{font-size:20px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rech .out{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule-2)}
.rech .out b{display:block;font-size:54px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc-ink)}
.rech .out span{font-size:21px;color:var(--ink-2)}
.ant .gross{font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-.01em;margin:0}
.ant .gt{font-size:23px;color:var(--ink-2);margin:4px 0 16px}
.raster{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:230px}
.raster i{aspect-ratio:1;background:var(--seg1);border-radius:3px}
.raster i.on{background:var(--acc)}
.ant .lab{font-size:19px;color:var(--ink-2);margin:12px 0 0}
.status{display:flex;flex-direction:column;gap:10px}
.status .srow{border-radius:12px;padding:10px 16px}
.status .srow b{display:block;font-size:17px;font-weight:700;margin-bottom:2px}
.status .srow ul{margin:0;padding-left:1.05em;font-size:20px;line-height:1.35}
.srow.ges{background:var(--ok-soft)} .srow.ges b{color:var(--ok)}
.srow.ums{background:var(--open-soft)} .srow.ums b{color:var(--open)}
.srow.off{background:var(--panel-2)} .srow.off b{color:var(--ink-2)}

/* ---- Auflösung ---- */
.res{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.rr{display:grid;grid-template-columns:44px 1.05fr 176px 1.25fr 210px;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 18px 10px 12px;min-height:100px}
.rr .st-l{font-size:26px}
.rr .rt{font-family:var(--serif);font-size:21px;line-height:1.28;margin:0}
.verdict{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:700;border-radius:999px;padding:6px 14px;white-space:nowrap;justify-self:start}
.verdict i{font-style:normal;font-size:20px}
.verdict.ja{background:var(--ok-soft);color:var(--ok)}
.verdict.nein{background:var(--no-soft);color:var(--no)}
.verdict.offen{background:var(--open-soft);color:var(--open)}
.rr .re{font-size:20px;line-height:1.35;margin:0}
.kl{font-size:16px;color:var(--ink-3);line-height:1.3}
.kl .klbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel-2);margin-bottom:5px}
.kl .klbar i{display:block;background:var(--seg2)}
.kl .klbar i.hit{background:var(--acc)}
.kl b{color:var(--ink);font-weight:600}

/* ---- Mini-Urteil ---- */
.urt{display:grid;grid-template-columns:1.25fr 1fr;gap:44px;margin-top:4px}
.urt h1{font-family:var(--serif);font-weight:600;font-size:46px;margin-bottom:18px}
.krit{display:flex;flex-direction:column;gap:12px}
.kr{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 20px}
.kr b{font-size:24px;color:var(--acc-ink)}
.kr em{font-style:normal;font-size:23px;font-weight:500;margin-left:8px}
.kr span{display:block;font-size:19px;line-height:1.35;color:var(--ink-2);margin-top:2px}
.frame{font-family:var(--serif);font-size:25px;line-height:1.4;background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--sheet-shadow);padding:18px 22px;margin:0 0 12px}
.frame u{text-decoration:none;border-bottom:2px solid var(--ink-3);padding:0 22px}
.vote{margin-top:16px}
.vrow{display:grid;grid-template-columns:130px 70px 1fr;gap:12px;align-items:center;margin-bottom:8px;font-size:20px}
.vrow .vb{height:22px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.vrow .vb i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s ease}

/* ---- Ausblick ---- */
.aus{display:grid;grid-template-columns:1fr 1.35fr;gap:44px;margin-top:10px}
.aus h3{font-size:24px;color:var(--acc-ink)}
.offen-l{list-style:none;margin:0;padding:0}
.offen-l li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:23px;line-height:1.3}
.offen-l li time{font-weight:600;color:var(--ink-2);font-size:20px;padding-top:2px}
.gipfel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.gipfel div{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 18px}
.gipfel b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:600;margin-bottom:6px}
.gipfel span{display:block;font-size:19px;line-height:1.35;color:var(--ink-2)}
.beob{margin:0;padding-left:1.2em;font-size:23px;line-height:1.35}
.beob li{margin-bottom:4px}
.aus .small{margin-top:12px}

/* ---- Quellen ---- */
.quellen{columns:2;column-gap:44px;font-size:17px;line-height:1.35;margin:10px 0 0;padding-left:1.3em}
.quellen li{break-inside:avoid;margin-bottom:9px}
.quellen span{display:block;color:var(--ink-3);font-size:15px;word-break:break-all}

/* ============ Fenster über der Bühne ============ */
#overview,#help{position:absolute;inset:0;background:var(--paper);z-index:30;padding:40px 56px;display:none;overflow:auto}
#overview.show,#help.show{display:block}
.ovh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
#ovgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ovcard{text-align:left;background:var(--panel);border:1.5px solid var(--rule);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:92px}
.ovcard:hover,.ovcard.cur{border-color:var(--acc)}
.ovcard .nr{display:block;font-size:15px;color:var(--ink-3)}
.ovcard b{display:block;font-size:19px;line-height:1.25}
.ovcard .ph{font-size:15px;color:var(--acc-ink)}
#help table{border-collapse:collapse;font-size:22px}
#help td{padding:7px 26px 7px 0;vertical-align:top}
kbd{font-family:var(--sans);font-size:18px;border:1.5px solid var(--rule);border-bottom-width:3px;border-radius:6px;padding:1px 8px;background:var(--panel)}
#timer{position:absolute;right:40px;bottom:64px;z-index:20;background:var(--panel);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--sheet-shadow);padding:16px 20px;display:none;text-align:center}
#timer.show{display:block}
#tdisp{font-size:84px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:10px}
#timer.done #tdisp{color:var(--no)}
.trow{display:flex;gap:6px;justify-content:center;margin-top:6px}
#blackout{position:absolute;inset:0;background:#000;z-index:50;display:none}
#blackout.show{display:block}
@media (prefers-reduced-motion: reduce){
  .slide.active{animation:none}
  .slide [data-step],.stp-seg,.stp-ghost,.vrow .vb i,#fill,#marker{transition:none}
}

/* ============ Passwortabfrage ============ */
#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--paper);padding:16px;font-family:var(--sans);color:var(--ink)}
#gate form{width:min(560px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--sheet-shadow);padding:32px 36px}
#gate h1{font-size:34px;margin:0 0 6px}
#gate p{font-size:19px;color:var(--ink-2);margin:0 0 18px}
#gate .gr{display:flex;gap:10px}
#gate input{flex:1;min-width:0;font:inherit;font-size:22px;padding:10px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}
#gate input:focus{outline:none;border-color:var(--acc)}
#gate button{font:inherit;font-size:20px;font-weight:600;padding:10px 20px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
#gmsg{min-height:1.4em;margin:12px 0 0 !important;color:var(--no) !important}
</style>
</head>
<body>
<div id="gate"><form id="gf"><h1>Aktuelle Stunde</h1><p>Politik-Wirtschaft. Bitte das Passwort eingeben.</p>
<div class="gr"><input id="gpw" type="password" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Passwort"><button>Öffnen</button></div>
<p id="gmsg"></p></form></div>
<div id="app"></div>

const KEY='as-pw';
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const get=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return ''}},set=v=>{try{localStorage.setItem(KEY,v)}catch(e){}};
async function unlock(pw){try{
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(LOCK.s),iterations:LOCK.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const p=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(LOCK.i)},k,b64d(LOCK.c))));
  document.getElementById('gate').remove();
  document.getElementById('app').innerHTML=p.markup;
  const s=document.createElement('script');s.textContent=p.code;document.body.appendChild(s);return true}catch(e){return false}}
(async function(){
  const m=/^#pw=([^&]+)/.exec(location.hash);
  if(m){let v=m[1];try{v=decodeURIComponent(v)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(await unlock(v)){set(v);return}}
  const saved=get();if(saved&&await unlock(saved))return;
  const g=document.getElementById('gate'),i=document.getElementById('gpw');g.style.display='flex';i.focus();
  document.getElementById('gf').onsubmit=async e=>{e.preventDefault();if(await unlock(i.value))set(i.value);else{document.getElementById('gmsg').textContent=window.crypto&&crypto.subtle?'Das Passwort stimmt nicht. Bitte noch einmal versuchen.':'Dieser Browser kann die Seite nicht öffnen. Bitte Safari, Chrome, Edge oder Firefox verwenden.';i.select()}};
})();
